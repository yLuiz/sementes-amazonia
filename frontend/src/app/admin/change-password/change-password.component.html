<app-page-header title="Trocar senha"></app-page-header>

<section class="password-panel">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <app-form-field label="Senha atual" controlId="password-old" [required]="true">
      <input id="password-old" class="control" type="password" autocomplete="current-password" formControlName="oldPassword" />
    </app-form-field>

    <app-form-field label="Nova senha" controlId="password-new" [required]="true" hint="Use pelo menos {{ minLength }} caracteres." [error]="newPasswordError">
      <input id="password-new" class="control" type="password" autocomplete="new-password" formControlName="newPassword" [maxlength]="maxLength" />
    </app-form-field>

    <app-form-field label="Confirmar nova senha" controlId="password-confirm" [required]="true" [error]="confirmPasswordError">
      <input id="password-confirm" class="control" type="password" autocomplete="new-password" formControlName="confirmPassword" [maxlength]="maxLength" />
    </app-form-field>

    @if (errorMessage) {
      <p class="password-panel__error" role="alert">
        <i class="pi pi-exclamation-circle" aria-hidden="true"></i>
        {{ errorMessage }}
      </p>
    }

    <button appButton class="password-panel__submit" type="submit" [loading]="isSaving" [disabled]="isSaving">
      {{ isSaving ? 'Salvando...' : 'Salvar nova senha' }}
    </button>
  </form>
</section>
