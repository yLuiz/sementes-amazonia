<div class="sidebar-backdrop" [class.is-open]="open" (click)="closed.emit()"></div>

<aside class="sidebar" [class.is-open]="open" aria-label="Painel administrativo">
  <div class="sidebar__header">
    <a routerLink="/" aria-label="Ir para o site">
      <img src="assets/logo_name.svg" alt="Sementes da Amazônia" width="180" height="48" />
    </a>
    <button class="sidebar__close" type="button" aria-label="Fechar menu" (click)="closed.emit()">
      <i class="pi pi-times" aria-hidden="true"></i>
    </button>
  </div>

  <nav class="sidebar__nav">
    <ul>
      @for (item of menuItems; track item.route) {
        <li>
          <a [routerLink]="item.route" routerLinkActive="is-active" (click)="closed.emit()">
            <i [class]="'pi ' + item.icon" aria-hidden="true"></i>
            {{ item.label }}
          </a>
        </li>
      }
    </ul>
  </nav>

  <div class="sidebar__footer">
    <a appButton="secondary" size="sm" routerLink="/">
      <i class="pi pi-external-link" aria-hidden="true"></i>
      Ir para o site
    </a>
    <button class="sidebar__logout" appButton="outline" size="sm" type="button" (click)="logout()">
      <i class="pi pi-sign-out" aria-hidden="true"></i>
      Sair
    </button>
  </div>
</aside>
