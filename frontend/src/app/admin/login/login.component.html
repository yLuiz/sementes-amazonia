<div class="login">
  <header class="login__header">
    <a routerLink="/" aria-label="Ir para o site">
      <img src="assets/logo_white.svg" alt="Sementes da Amazônia" width="180" height="48" />
    </a>
  </header>

  <main class="login__main">
    <section class="login__card">
      <h1>Acesse a sua conta</h1>
      <p class="login__intro">Insira as credenciais para acessar o painel de administrador do site.</p>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <app-form-field label="Usuário" controlId="login-username">
          <input id="login-username" class="control" type="text" autocomplete="username" formControlName="username" placeholder="Digite seu usuário" />
        </app-form-field>

        <app-form-field label="Senha" controlId="login-password">
          <app-password-reveal>
            <input #passwordInput id="login-password" class="control control--with-action" type="password" autocomplete="current-password" formControlName="password" placeholder="Digite sua senha" />
          </app-password-reveal>
        </app-form-field>

        @if (errorMessage) {
          <p class="login__error" role="alert">
            <i class="pi pi-exclamation-circle" aria-hidden="true"></i>
            {{ errorMessage }}
          </p>
        }

        <button appButton class="login__submit" type="submit" [loading]="isLoading" [disabled]="form.invalid || isLoading">
          {{ isLoading ? 'Entrando...' : 'Entrar no painel' }}
        </button>
      </form>
    </section>
  </main>
</div>
