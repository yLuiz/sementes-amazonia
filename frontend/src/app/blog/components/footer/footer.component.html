<footer id="footer" class="footer">
  <div class="container">
    <div class="footer__grid">
      <div class="footer__brand">
        <img src="assets/logo_white.svg" alt="Sementes da Amazônia" width="180" height="48" />
        <p>{{ content.tagline }}</p>
      </div>

      <div>
        <h2 class="footer__heading">Contato</h2>
        <ul class="footer__contact">
          <li>
            <i class="pi pi-phone" aria-hidden="true"></i>
            <a [href]="'tel:' + phoneHref">{{ content.contact.phone }}</a>
          </li>
          <li>
            <i class="pi pi-envelope" aria-hidden="true"></i>
            <a [href]="'mailto:' + content.contact.email">{{ content.contact.email }}</a>
          </li>
        </ul>
      </div>

      <div>
        <h2 class="footer__heading">Endereço</h2>
        <ul class="footer__contact">
          <li>
            <i class="pi pi-map-marker" aria-hidden="true"></i>
            <span>{{ content.contact.address }}</span>
          </li>
        </ul>
      </div>

      <nav aria-label="Rodapé">
        <h2 class="footer__heading">Navegação</h2>
        <ul class="footer__nav">
          <li><a routerLink="/">Início</a></li>
          <li><a routerLink="/about-us">Sobre nós</a></li>
          <li><a routerLink="/about-us" fragment="areas">Áreas de atuação</a></li>
          <li><a routerLink="/list-all" [queryParams]="{ type: 'news' }">Notícias</a></li>
          <li><a routerLink="/list-all" [queryParams]="{ type: 'projects' }">Projetos</a></li>
        </ul>
      </nav>
    </div>

    <p class="footer__copyright">© {{ year }} Sementes da Amazônia. Todos os direitos reservados.</p>
  </div>
</footer>

<button
  class="back-to-top"
  type="button"
  aria-label="Voltar ao topo"
  title="Voltar ao topo"
  [class.is-visible]="showBackToTop"
  [attr.tabindex]="showBackToTop ? null : -1"
  (click)="backToTop()">
  <i class="pi pi-arrow-up" aria-hidden="true"></i>
</button>
