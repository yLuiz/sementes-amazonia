<section id="news" class="news">
  <div class="container">
    <app-section-header
      eyebrow="Acompanhe"
      title="Últimas notícias"
      description="O que está acontecendo nos nossos projetos, parcerias e comunidades.">
    </app-section-header>
    @if (status === 'loading') {
      <ul class="news__grid" aria-hidden="true">
        @for (placeholder of placeholders; track placeholder) {
          <li class="skeleton news__placeholder"></li>
        }
      </ul>
    } @else if (status === 'error') {
      <app-empty-state
        icon="pi-exclamation-circle"
        title="Não foi possível carregar as notícias"
        text="Tente novamente em instantes.">
        <button appButton="outline" type="button" (click)="load()">Tentar novamente</button>
      </app-empty-state>
    } @else if (newsList.length) {
      <ul class="news__grid">
        @for (news of newsList; track news.id; let i = $index) {
          <li appReveal [revealDelay]="i * 80">
            <app-content-card type="news" [item]="news"></app-content-card>
          </li>
        }
      </ul>
      <div class="news__action">
        <a appButton="outline" routerLink="/list-all" [queryParams]="{ type: 'news' }">Ver todas as notícias</a>
      </div>
    } @else {
      <app-empty-state icon="pi-inbox" title="Nenhuma notícia publicada" text="Volte em breve para acompanhar as novidades."></app-empty-state>
    }
  </div>
</section>
