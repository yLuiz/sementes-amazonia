<section id="news" class="news">
  <div class="container">
    <app-section-header
      eyebrow="Acompanhe"
      title="Últimas notícias"
      description="O que está acontecendo nos nossos projetos, parcerias e comunidades.">
    </app-section-header>
    <ul class="news__grid">
      @for (news of newsList; track news.id; let i = $index) {
        <li appReveal [revealDelay]="i * 80">
          <app-content-card type="news" [item]="news"></app-content-card>
        </li>
      }
    </ul>
    <div class="news__action">
      <a appButton="outline" routerLink="/list-all" [queryParams]="{ type: 'news' }">Ver todas as notícias</a>
    </div>
  </div>
</section>
