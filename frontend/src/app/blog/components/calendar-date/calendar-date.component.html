<div [formGroup]="fg" class="cd-container">
  @if (label) {
    <label class="cd-label">{{ label }}</label>
  }

  <div class="cd-grid">
    <select class="control" aria-label="Ano" formControlName="year" (change)="recalcDays()" (blur)="onBlurField()">
      @if (allowEmpty) {
        <option [ngValue]="null">Ano</option>
      }
      @for (y of years; track y) {
        <option [value]="y">{{ y }}</option>
      }
    </select>

    <select class="control" aria-label="Mês" formControlName="month" (change)="recalcDays()" (blur)="onBlurField()">
      @if (allowEmpty) {
        <option [ngValue]="null">Mês</option>
      }
      @for (m of months; track m.value) {
        <option [value]="m.value">{{ m.label }}</option>
      }
    </select>

    <select class="control" aria-label="Dia" formControlName="day" (blur)="onBlurField()">
      @if (allowEmpty) {
        <option [ngValue]="null">Dia</option>
      }
      @for (d of daysInMonth; track d) {
        <option [value]="d">{{ d }}</option>
      }
    </select>
  </div>
</div>
