<section id="projects" class="projects">
  <div class="container">
    <app-section-header
      eyebrow="Na prática"
      title="Projetos"
      description="Iniciativas de conservação, restauração e fortalecimento das comunidades da Amazônia.">
    </app-section-header>
    @if (status === 'loading') {
      <ul class="projects__grid" aria-hidden="true">
        @for (placeholder of placeholders; track placeholder) {
          <li class="skeleton projects__placeholder"></li>
        }
      </ul>
    } @else if (status === 'error') {
      <app-empty-state
        icon="pi-exclamation-circle"
        title="Não foi possível carregar os projetos"
        text="Tente novamente em instantes.">
        <button appButton="outline" type="button" (click)="load()">Tentar novamente</button>
      </app-empty-state>
    } @else if (projects.length) {
      <ul class="projects__grid">
        @for (project of projects; track project.id; let i = $index) {
          <li appReveal [revealDelay]="i * 80">
            <app-content-card type="project" [item]="project"></app-content-card>
          </li>
        }
      </ul>
      <div class="projects__action">
        <a appButton="outline" routerLink="/list-all" [queryParams]="{ type: 'projects' }">Ver todos os projetos</a>
      </div>
    } @else {
      <app-empty-state icon="pi-inbox" title="Nenhum projeto publicado" text="Volte em breve para conhecer nossas iniciativas."></app-empty-state>
    }
  </div>
</section>
