<section class="impact">
  <div class="container">
    <app-section-header eyebrow="Em números" title="Nosso impacto" align="center"></app-section-header>
    <ul class="impact__stats">
      @for (stat of stats; track stat.label; let i = $index) {
        <li appReveal [revealDelay]="i * 80">
          <app-stat [value]="stat.value" [label]="stat.label" [icon]="stat.icon"></app-stat>
        </li>
      }
    </ul>
  </div>
</section>
