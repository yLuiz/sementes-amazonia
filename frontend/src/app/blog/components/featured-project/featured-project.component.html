@if (project; as item) {
  <section id="featured-project" class="featured">
    <div class="featured__image media" appReveal>
      <img [ngSrc]="image" fill sizes="(max-width: 1023px) 100vw, 50vw" [alt]="item.title" appImgFallback="assets/photos/community-planting.webp" />
    </div>
    <div class="featured__content" appReveal [revealDelay]="80">
      <p class="eyebrow">Projeto em destaque</p>
      <h2 class="featured__title">{{ item.title }}</h2>
      <ul class="featured__badges">
        <li><app-badge variant="inverse">Alto impacto</app-badge></li>
        <li><app-badge variant="inverse">Foco atual</app-badge></li>
      </ul>
      <p class="featured__text">{{ item.summary }}</p>
      <div class="btn-group">
        <a appButton="inverse" [routerLink]="['/article', item.id]" [queryParams]="{ type: 'project' }">Conheça o projeto</a>
      </div>
    </div>
  </section>
}
