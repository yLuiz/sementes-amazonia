<header class="navbar" [class.navbar--solid]="!overlay || scrolled">
  <div class="container navbar__inner">
    <a class="navbar__logo" routerLink="/" aria-label="Sementes da Amazônia, página inicial" (click)="closeMenu()">
      <img src="assets/logo_white.svg" alt="" width="180" height="48" />
    </a>

    <nav class="navbar__links" aria-label="Navegação principal">
      <div class="navbar__dropdown" [class.is-open]="isDropdownOpen">
        <button
          class="navbar__link"
          type="button"
          aria-haspopup="true"
          [attr.aria-expanded]="isDropdownOpen"
          (click)="toggleDropdown($event)">
          Sobre nós
          <i class="pi pi-chevron-down" aria-hidden="true"></i>
        </button>
        <ul class="navbar__submenu">
          <li><a routerLink="/about-us" (click)="closeDropdown()">Nossa história</a></li>
          <li><a routerLink="/about-us" fragment="areas" (click)="closeDropdown()">Áreas de atuação</a></li>
        </ul>
      </div>
      <a
        class="navbar__link"
        routerLink="/list-all"
        [queryParams]="{ type: 'news' }"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="activeOptions">
        Notícias
      </a>
      <a
        class="navbar__link"
        routerLink="/list-all"
        [queryParams]="{ type: 'projects' }"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="activeOptions">
        Projetos
      </a>
      <button class="navbar__link" type="button" (click)="goToContact()">Contato</button>
    </nav>

    <a class="navbar__cta" appButton="inverse" size="sm" routerLink="/list-all" [queryParams]="{ type: 'projects' }">
      Conheça os projetos
    </a>

    <button
      class="navbar__toggle"
      type="button"
      [attr.aria-label]="isMenuOpen ? 'Fechar menu' : 'Abrir menu'"
      [attr.aria-expanded]="isMenuOpen"
      aria-controls="mobile-menu"
      (click)="toggleMenu()">
      <i class="pi" [class.pi-bars]="!isMenuOpen" [class.pi-times]="isMenuOpen" aria-hidden="true"></i>
    </button>
  </div>
</header>

<!-- Fora do header: o desfoque dele criaria um novo contexto para o painel fixo. -->
<div class="mobile-backdrop" [class.is-open]="isMenuOpen" (click)="closeMenu()"></div>
<nav id="mobile-menu" class="mobile-menu" [class.is-open]="isMenuOpen" [attr.inert]="isMenuOpen ? null : ''" aria-label="Menu">
  <ul>
    <li><a routerLink="/about-us" (click)="closeMenu()">Nossa história</a></li>
    <li><a routerLink="/about-us" fragment="areas" (click)="closeMenu()">Áreas de atuação</a></li>
    <li><a routerLink="/list-all" [queryParams]="{ type: 'news' }" (click)="closeMenu()">Notícias</a></li>
    <li><a routerLink="/list-all" [queryParams]="{ type: 'projects' }" (click)="closeMenu()">Projetos</a></li>
    <li><button type="button" (click)="goToContact()">Contato</button></li>
  </ul>
  <a appButton="inverse" routerLink="/list-all" [queryParams]="{ type: 'projects' }" (click)="closeMenu()">
    Conheça os projetos
  </a>
</nav>

@if (!overlay) {
  <div class="navbar-spacer"></div>
}
