<section id="about" class="about">
  <div class="container about__grid">
    <div class="about__text" appReveal>
      <p class="eyebrow">Quem somos</p>
      <h2>Protegendo nosso meio ambiente para gerações futuras</h2>
      <p class="lead">{{ intro }}</p>
      <p>{{ detail }}</p>
      <div class="btn-group">
        <a appButton routerLink="/about-us">Saiba mais sobre nós</a>
        <a appButton="outline" routerLink="/list-all" [queryParams]="{ type: 'projects' }">Conheça nossos projetos</a>
      </div>
    </div>
    <div class="about__image media" appReveal [revealDelay]="80">
      <img ngSrc="assets/photos/forest-giant-tree.webp" fill sizes="(max-width: 1023px) 100vw, 50vw" alt="Interior da floresta amazônica, com uma grande árvore em primeiro plano" />
    </div>
  </div>
</section>
