<app-navbar></app-navbar>

<main class="listing">
  <div class="container">
    <app-section-header
      level="h1"
      eyebrow="Acervo"
      [title]="selectedFilter === 'news' ? 'Todas as notícias' : 'Todos os projetos'"
      [description]="selectedFilter === 'news'
        ? 'Acompanhe o que está acontecendo nos nossos projetos, parcerias e comunidades.'
        : 'Conheça as iniciativas de conservação, restauração e fortalecimento das comunidades.'">
    </app-section-header>

    <div class="listing__controls">
      <div class="listing__search">
        <i class="pi pi-search" aria-hidden="true"></i>
        <label class="visually-hidden" for="listing-search">Pesquisar por título</label>
        <input
          id="listing-search"
          class="control"
          type="search"
          placeholder="Pesquisar por título"
          [(ngModel)]="searchTerm"
          (input)="onSearchChange()" />
        @if (searchTerm) {
          <button class="listing__clear" type="button" aria-label="Limpar pesquisa" (click)="clearSearch()">
            <i class="pi pi-times" aria-hidden="true"></i>
          </button>
        }
      </div>

      <div class="listing__tabs" role="group" aria-label="Filtrar por tipo de conteúdo">
        <button type="button" [class.is-active]="selectedFilter === 'news'" [attr.aria-pressed]="selectedFilter === 'news'" (click)="onFilterChange('news')">
          Notícias
        </button>
        <button type="button" [class.is-active]="selectedFilter === 'projects'" [attr.aria-pressed]="selectedFilter === 'projects'" (click)="onFilterChange('projects')">
          Projetos
        </button>
      </div>
    </div>

    @if (isLoading) {
      <ul class="listing__grid" aria-hidden="true">
        @for (placeholder of placeholders; track placeholder) {
          <li class="skeleton listing__placeholder"></li>
        }
      </ul>
    } @else if (hasError) {
      <app-empty-state
        icon="pi-exclamation-circle"
        [title]="selectedFilter === 'news' ? 'Não foi possível carregar as notícias' : 'Não foi possível carregar os projetos'"
        text="Tente novamente em instantes.">
        <button appButton="outline" type="button" (click)="load()">Tentar novamente</button>
      </app-empty-state>
    } @else if (items.length) {
      <ul class="listing__grid">
        @for (item of items; track item.id; let i = $index) {
          <li appReveal [revealDelay]="(i % 3) * 80">
            <app-content-card [type]="selectedFilter === 'news' ? 'news' : 'project'" [item]="item" [priority]="i < 3"></app-content-card>
          </li>
        }
      </ul>
    } @else {
      <app-empty-state title="Nenhum resultado encontrado" text="Tente ajustar a pesquisa ou trocar o tipo de conteúdo."></app-empty-state>
    }

    @if (totalItems > 0) {
      <mat-paginator
        class="listing__paginator"
        [length]="totalItems"
        [pageSize]="pageSize"
        [pageSizeOptions]="pageSizeOptions"
        [pageIndex]="currentPage"
        [showFirstLastButtons]="true"
        aria-label="Navegação de páginas"
        (page)="onPageChange($event)">
      </mat-paginator>
    }
  </div>
</main>

<app-footer></app-footer>
